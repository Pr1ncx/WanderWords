<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WANDERWORDS · Ten stops. Ten stories. One India.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Sometype+Mono:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&family=Shrikhand&display=swap" rel="stylesheet" />
</head>
<body class="is-locked">
  <!-- Layer stack: #webgl (1) < #trainContainer (5) < #destination (10) < menu and controls -->
  <canvas id="webgl"></canvas>

  <!-- Fixed controls -->
  <div id="badge" class="miu-badge ctrl" aria-label="Current stop">
    <span class="miu-badge__arrow">↗</span>
    <span id="badgeNum" class="miu-badge__text">1/10</span>
  </div>

  <button id="menuBtn" class="miu-icon-btn ctrl" aria-label="Open the index of stops">
    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
      <path d="M6 6h10"></path>
      <path d="M6 10h10"></path>
      <path d="M6 14h6"></path>
    </svg>
  </button>

  <button id="soundBtn" class="miu-sound-btn ctrl is-muted" aria-label="Toggle music">
    <svg class="sound-on-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
    </svg>
    <svg class="sound-off-icon" viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
  </button>

  <div class="ctrl-br ctrl">
    <button id="ccBtn" class="miu-chip" aria-label="Toggle captions">CC</button>
  </div>
  <p id="cc" class="cc"></p>

  <!-- 1. Loader -->
  <div id="loader">
    <div class="mosaic mosaic--top"></div>
    <div class="loader__center">
      <p class="loader__word">loading</p>
      <p class="loader__pct">0%</p>
    </div>
    <div class="loader__prompt">
      <p class="micro">Activate sound for a better experience</p>
      <div class="loader__actions">
        <button class="btn" data-sound="on"><span>Sound on</span></button>
        <button class="btn btn--ghost" data-sound="off"><span>Continue muted</span></button>
      </div>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </div>

  <!-- 2. Cover gate -->
  <section id="intro">
    <div class="mosaic mosaic--top"></div>
    <div class="intro__card">
      <p class="eyebrow">WanderWords · Issue 01</p>
      <h1 class="intro__title"><em>The</em> INDIAN JOURNEY <em>begins</em></h1>
      <p class="micro">Ten stops. Ten stories. One India.</p>
      <button class="btn btn--magnetic" id="start"><span>Start now</span></button>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </section>

  <!-- 3. TrainCanvas layer: the train view and its caption overlay -->
  <div id="trainContainer" class="train-container">
    <video id="trainVideo" class="train-video" src="/media/train-window.mp4" playsinline loop muted preload="auto" disablepictureinpicture disableremoteplayback></video>
    <div id="trainOverlay">
      <p id="trainCaption" class="caption"></p>
      <button id="skipBtn" class="skip-intro">SKIP INTRO &gt;</button>
    </div>
  </div>

  <!-- 4. DestinationEditorial layer: filled and scrolled by src/destination/ -->
  <main id="destination" class="destination" tabindex="-1" aria-label="Destination"></main>

  <!-- Index of stops -->
  <nav id="menu" class="overlay menu" data-lenis-prevent>
    <button id="menuClose" class="close-btn">Close ✕</button>
    <div class="menu__body"></div>
  </nav>

  <!-- Finale -->
  <section id="gift">
    <div class="mosaic mosaic--top"></div>
    <div class="intro__card">
      <p class="eyebrow">Journey complete</p>
      <h2 class="intro__title"><em>Your</em> POSTCARD <em>awaits</em></h2>
      <p class="micro">Ten stops. One India.</p>
      <button class="btn btn--magnetic" id="download"><span>Download postcard</span></button>
      <button class="btn btn--ghost" id="restart"><span>Travel again</span></button>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </section>

  <!-- Print finish: one static paper layer -->
  <div class="paper" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
