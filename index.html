<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WANDERWORDS · Ten stops. Ten stories. One India.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body class="is-locked">
  <svg class="svg-defs" width="0" height="0" aria-hidden="true">
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.015 0.04" numOctaves="3" seed="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="34" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

  <canvas id="webgl"></canvas>

  <!-- Painted frame + scalloped jharokha corners -->
  <div id="frame"></div>
  <div class="scallop scallop--tl"></div>
  <div class="scallop scallop--br"></div>

  <!-- Fixed controls -->
  <a id="badge" class="ctrl" aria-label="WanderWords India Rail Tour">
    <svg viewBox="0 0 120 120">
      <defs><path id="ring" d="M60,60 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0" /></defs>
      <circle cx="60" cy="60" r="57" fill="#F3E6CC" />
      <circle cx="60" cy="60" r="51" fill="none" stroke="#6B3A24" stroke-width="1.5" />
      <circle cx="60" cy="60" r="34" fill="none" stroke="#6B3A24" stroke-width="1" />
      <text font-family="Inter" font-weight="700" font-size="9.5" letter-spacing="2.2" fill="#6B3A24">
        <textPath href="#ring">WANDERWORDS · INDIA RAIL TOUR · EST. 2026 ·</textPath>
      </text>
      <text x="60" y="70" text-anchor="middle" font-family="Shrikhand" font-size="28" fill="#B5523B">WW</text>
    </svg>
  </a>
  <button id="menuBtn" class="pill ctrl" aria-label="Open menu"><span>Menu</span><i class="burger"></i></button>
  <button id="soundBtn" class="sound-btn ctrl is-muted" aria-label="Toggle music">♪</button>
  <div class="ctrl-br ctrl">
    <button id="ccBtn" class="pill-sm" aria-label="Toggle captions">CC</button>
    <button id="replayBtn" class="pill-sm" aria-label="Replay chapter">↺</button>
  </div>
  <p id="cc" class="cc"></p>

  <!-- 1. Loader -->
  <div id="loader">
    <div class="mosaic mosaic--top"></div>
    <div class="loader__center">
      <p class="loader__word">loading</p>
      <p class="loader__pct">0%</p>
    </div>
    <div class="loader__prompt">
      <p class="micro">Activate sound for a better experience</p>
      <div class="loader__actions">
        <button class="btn" data-sound="on"><span>Sound on</span></button>
        <button class="btn btn--ghost" data-sound="off"><span>Continue muted</span></button>
      </div>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </div>

  <!-- 2. Cover gate -->
  <section id="intro">
    <div class="mosaic mosaic--top"></div>
    <div class="intro__card">
      <p class="eyebrow">WanderWords · Issue 01</p>
      <h1 class="intro__title"><em>The</em> INDIAN JOURNEY <em>begins</em></h1>
      <p class="micro">Ten stops. Ten stories. One India.</p>
      <button class="btn btn--magnetic" id="start"><span>Start now</span></button>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </section>

  <!-- 3. Train overlay (intro + rides) -->
  <div id="trainOverlay">
    <p id="trainCaption" class="caption"></p>
    <button id="skipBtn" class="skip-intro">SKIP INTRO &gt;</button>
  </div>

  <!-- 4. Chapter title card -->
  <section id="titleCard" class="title-card">
    <p class="eyebrow" id="tcNum">CHAPTER 01</p>
    <h1 id="tcTitle" class="tc-title"></h1>
    <p class="micro" id="tcCity"></p>
    <button id="exploreBtn" class="explore-btn">EXPLORE &gt;</button>
  </section>

  <!-- 5. Room exploration UI -->
  <div id="exploreUI">
    <article id="exhibit" class="exhibit">
      <p class="ex-num"></p>
      <h3></h3>
      <p class="ex-text"></p>
      <button id="viewBtn" class="link-btn"><span>View &gt;</span></button>
    </article>
    <div id="dots" class="dots"></div>
    <p id="hint" class="hint">Scroll to explore ↓</p>
    <div id="endPanel" class="end-panel">
      <p class="eyebrow">End of chapter</p>
      <button id="readBtn" class="btn btn--magnetic"><span>Read the story</span></button>
      <button id="nextBtn" class="btn btn--magnetic btn--solid"><span>Next stop →</span></button>
    </div>
  </div>

  <!-- Overlays -->
  <section id="article" class="overlay article" data-lenis-prevent>
    <button id="articleClose" class="close-btn">Back to the room ✕</button>
    <div class="article__inner"></div>
  </section>

  <section id="lightbox" class="overlay lightbox">
    <button id="lbClose" class="close-btn">Close ✕</button>
    <button id="lbPrev" class="lb-arrow lb-arrow--prev" aria-label="Previous">‹</button>
    <div class="lb-body"></div>
    <button id="lbNext" class="lb-arrow lb-arrow--next" aria-label="Next">›</button>
  </section>

  <nav id="menu" class="overlay menu" data-lenis-prevent>
    <button id="menuClose" class="close-btn">Close ✕</button>
    <div class="menu__body"></div>
  </nav>

  <div id="tunnel"><p id="tunnelText"></p></div>

  <!-- Finale -->
  <section id="gift">
    <div class="mosaic mosaic--top"></div>
    <div class="intro__card">
      <p class="eyebrow">Journey complete</p>
      <h2 class="intro__title"><em>Your</em> POSTCARD <em>awaits</em></h2>
      <p class="micro">Ten stops. One India.</p>
      <button class="btn btn--magnetic" id="download"><span>Download postcard</span></button>
      <button class="btn btn--ghost" id="restart"><span>Travel again</span></button>
    </div>
    <div class="mosaic mosaic--bottom"></div>
  </section>

  <div id="scroll-space"></div>

  <!-- Print finish: paper fibre and film grain over everything -->
  <div class="paper" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
